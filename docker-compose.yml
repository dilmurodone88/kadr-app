# ── Kadr Tizimi — Docker Compose (mustahkamlangan) ──────────────────
# Oqim:  db (healthy) → migrate (bir marta: db push + seed) → app → nginx
# Yagona kirish nuqtasi: http://localhost

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.0
    container_name: kadr_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    networks: [kadr_net]

  # Bir martalik migratsiya + seed (app'dan ajratilgan — poyga yo'q, scale xavfsiz)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: kadr-app:latest
    command: ["./scripts/migrate.sh"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    networks: [kadr_net]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: kadr-app:latest
    container_name: kadr_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      FORCE_INSECURE_COOKIE: ${FORCE_INSECURE_COOKIE:-1}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
    logging: *default-logging
    networks: [kadr_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: kadr_nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging
    networks: [kadr_net]

volumes:
  mysql_data:
    name: kadr_mysql_data

networks:
  kadr_net:
    name: kadr_net
    driver: bridge
