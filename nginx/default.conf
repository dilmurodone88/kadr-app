# ── Kadr Tizimi — Nginx reverse proxy (mustahkamlangan) ─────────────
# Yagona kirish nuqtasi: http://localhost (80) → app:3000

upstream kadr_app {
    server app:3000;
    keepalive 32;
}

# Rate-limit zonalari (brute-force / suiiste'molga qarshi) — http kontekst
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    # ── Xavfsizlik sarlavhalari (barcha proksi javoblarga) ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── Umumiy proksi sozlamalari (location'larga meros bo'ladi) ──
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    # Hujjat (docx) generatsiyasi sekinroq bo'lishi mumkin
    proxy_read_timeout 120s;

    # ── Next.js statik fayllar (uzoq kesh, rate-limitsiz) ──
    location /_next/static/ {
        proxy_pass http://kadr_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Healthcheck (log yozilmaydi) ──
    location = /api/health {
        proxy_pass http://kadr_app;
        access_log off;
    }

    # ── Login — qattiq rate-limit (brute-force himoyasi) ──
    location /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://kadr_app;
    }

    # ── API — o'rtacha rate-limit ──
    location /api/ {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://kadr_app;
    }

    # ── Qolgan hammasi ──
    location / {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://kadr_app;
    }
}
