# Kadr Tizimi — Nginx reverse proxy
# Yagona kirish nuqtasi: http://localhost (port 80) → app:3000

upstream kadr_app {
    server app:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    client_max_body_size 10m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml;
    gzip_min_length 1024;

    # Next.js statik fayllar (uzoq kesh)
    location /_next/static/ {
        proxy_pass http://kadr_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://kadr_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HMR / websocket (kelajakda kerak bo'lsa)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
